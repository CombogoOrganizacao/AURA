<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — Ambiente Unificado de Revisão Acadêmica</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <!-- Google Fonts: Inter e Merriweather / Lora para tipografia acadêmica premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- DOCX/PDF export & parsing utilities -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Tailwind via CDN para prototipagem rápida e visualização dinâmica -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Lora', 'Merriweather', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            aura: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#b9ddfd',
              300: '#7cc2fb',
              400: '#36a3f7',
              500: '#0c87eb',
              600: '#026bc9',
              700: '#0355a2',
              800: '#074885',
              900: '#0c3d6e',
              950: '#082749',
            },
            academic: {
              gold: '#c69214',
              emerald: '#059669',
              ruby: '#dc2626',
              amber: '#d97706',
              slate: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css?v=2.0.1">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden selection:bg-aura-500 selection:text-white">
  
  <!-- APP HEADER / TOPBAR -->
  <header id="app-header" class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between transition-all">
    <div class="flex items-center gap-3 sm:gap-6">
      <div class="flex items-center gap-2.5 sm:gap-3 cursor-pointer" onclick="AURA.navigate('home')">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-aura-600 via-aura-500 to-indigo-400 p-[2px] shadow-lg shadow-aura-500/20 flex-shrink-0">
          <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center">
            <span class="text-lg sm:text-xl font-black tracking-wider bg-gradient-to-r from-aura-400 to-indigo-300 bg-clip-text text-transparent">A</span>
          </div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">AURA</h1>
          </div>
          <p id="app-header-subtitle" class="text-[10px] sm:text-[11px] text-slate-400 font-normal truncate max-w-[150px] sm:max-w-none">Ambiente Unificado de Revisão Acadêmica</p>
        </div>
      </div>

      <!-- Navigation Tabs (Desktop / Tablet) -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-800/60 p-1 rounded-lg border border-slate-700/50">
        <button id="nav-btn-home" onclick="AURA.navigate('home')" class="nav-tab px-3.5 py-1.5 rounded-md text-xs font-medium transition-all text-white bg-slate-700/80 shadow-sm flex items-center gap-2">
          <i data-lucide="compass" class="w-4 h-4 text-aura-400"></i> <span data-i18n="nav_home">Início</span>
        </button>
        <button id="nav-btn-editor" onclick="AURA.navigate('editor')" class="nav-tab px-3.5 py-1.5 rounded-md text-xs font-medium transition-all text-slate-300 hover:text-white flex items-center gap-2">
          <i data-lucide="file-edit" class="w-4 h-4 text-indigo-400"></i> <span data-i18n="nav_editor">Editor & Normas</span>
        </button>
        <button id="nav-btn-notices" onclick="AURA.navigate('notices')" class="nav-tab px-3.5 py-1.5 rounded-md text-xs font-medium transition-all text-slate-300 hover:text-white flex items-center gap-2">
          <i data-lucide="graduation-cap" class="w-4 h-4 text-amber-400"></i> <span data-i18n="nav_notices">Central de Editais</span>
        </button>
        <button id="nav-btn-dashboard" onclick="AURA.navigate('dashboard')" class="nav-tab px-3.5 py-1.5 rounded-md text-xs font-medium transition-all text-slate-300 hover:text-white flex items-center gap-2">
          <i data-lucide="layout-grid" class="w-4 h-4 text-emerald-400"></i> <span data-i18n="nav_dashboard">Meus Trabalhos</span>
        </button>
      </nav>
    </div>

    <!-- Right Header Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Language Switcher PT / EN -->
      <div class="flex items-center bg-slate-800/90 rounded-lg p-0.5 border border-slate-700/80 text-[11px] font-bold">
        <button id="lang-btn-pt" onclick="AURA.setLanguage('pt')" class="px-2 py-1 rounded-md text-white bg-aura-600 shadow-sm transition-all">PT</button>
        <button id="lang-btn-en" onclick="AURA.setLanguage('en')" class="px-2 py-1 rounded-md text-slate-400 hover:text-white transition-all">EN</button>
      </div>

      <!-- Active Document Badge (when in editor) -->
      <div id="header-doc-badge" class="hidden"></div>

      <!-- Quick Actions -->
      <button onclick="AURA.openNewDocModal()" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-aura-600 to-indigo-600 hover:from-aura-500 hover:to-indigo-500 text-white text-xs font-semibold shadow-md shadow-aura-600/30 flex items-center gap-1.5 transition-all">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline" data-i18n="btn_new_doc">Novo Trabalho</span>
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="app-main" class="flex-1 flex flex-col relative overflow-y-auto pb-16 md:pb-0">
    <!-- View 1: Home / Onboarding (4 Portais Principais) -->
    <section id="view-home" class="view-section active flex-1"></section>

    <!-- View 2: Editor Acadêmico & Normas -->
    <section id="view-editor" class="view-section hidden flex-1 flex flex-col"></section>

    <!-- View 3: Central de Editais & Publicações -->
    <section id="view-notices" class="view-section hidden flex-1"></section>

    <!-- View 4: Meus Trabalhos / Dashboard -->
    <section id="view-dashboard" class="view-section hidden flex-1"></section>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION (Visible on screens < md) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-2 py-1.5 flex items-center justify-around">
    <button onclick="AURA.navigate('home')" id="mob-nav-home" class="mob-nav-item flex flex-col items-center gap-0.5 text-aura-400 py-1 px-2">
      <i data-lucide="compass" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium" data-i18n="nav_home">Início</span>
    </button>
    <button onclick="AURA.navigate('editor')" id="mob-nav-editor" class="mob-nav-item flex flex-col items-center gap-0.5 text-slate-400 py-1 px-2">
      <i data-lucide="file-edit" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium" data-i18n="nav_editor">Editor</span>
    </button>
    <button onclick="AURA.navigate('notices')" id="mob-nav-notices" class="mob-nav-item flex flex-col items-center gap-0.5 text-slate-400 py-1 px-2">
      <i data-lucide="graduation-cap" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium" data-i18n="nav_notices">Editais</span>
    </button>
    <button onclick="AURA.navigate('dashboard')" id="mob-nav-dashboard" class="mob-nav-item flex flex-col items-center gap-0.5 text-slate-400 py-1 px-2">
      <i data-lucide="layout-grid" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium" data-i18n="nav_dashboard">Trabalhos</span>
    </button>
  </nav>

  <!-- MODALS CONTAINER -->
  <div id="modal-container" class="relative z-50"></div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container" class="fixed bottom-16 md:bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- CORE SCRIPTS (Modular & Clean) -->
  <script src="js/engine/i18n.js?v=2.3.0"></script>
  <script src="js/engine/standards.js?v=2.3.0"></script>
  <script src="js/engine/rulesEngine.js?v=2.3.0"></script>
  <script src="js/engine/documentParser.js?v=2.3.0"></script>
  <script src="js/engine/noticeParser.js?v=2.3.0"></script>
  <script src="js/engine/languageAndStats.js?v=2.3.0"></script>
  <script src="js/engine/exportEngine.js?v=2.3.0"></script>
  <script src="js/mock/sampleData.js?v=2.3.0"></script>
  <script src="js/components/homeView.js?v=2.3.0"></script>
  <script src="js/components/editorView.js?v=2.3.0"></script>
  <script src="js/components/noticesView.js?v=2.3.0"></script>
  <script src="js/components/dashboardView.js?v=2.3.0"></script>
  <script src="js/components/modals.js?v=2.3.0"></script>
  <script src="js/app.js?v=2.3.0"></script>
</body>
</html>
