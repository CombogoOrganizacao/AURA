name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Testes de unidade com cobertura de src/core/ (passo 6.6.2). Os pisos
      # por área estão em vitest.config.mts; abaixo deles, o CI falha.
      - run: npm run test:coverage

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-src-core
          path: coverage/
          retention-days: 14

      - run: npm run build
